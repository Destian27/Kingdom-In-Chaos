name: Build Kingdom In Chaos DTP APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download apktool
        run: |
          mkdir -p tools
          curl -fsSL -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > tools/release.keystore
          fi

      - name: Build APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          [ -z "$KEYSTORE_PASS" ] && unset KEYSTORE_PASS
          [ -z "$KEYSTORE_ALIAS" ] && unset KEYSTORE_ALIAS
          python3 build_dtp.py

      - uses: actions/upload-artifact@v4
        with:
          name: KingdomInChaosDTP-apk
          path: KingdomInChaosDTP.apk
