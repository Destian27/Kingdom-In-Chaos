name: Build Kingdom In Chaos DTP APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform, build-tools, and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)"; fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Download apktool
        run: |
          mkdir -p tools
          curl -fsSL -o tools/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p tools
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > tools/release.keystore
            echo "Keystore: dari secret KEYSTORE_BASE64"
          else
            cp keystore/dtp-fixed.keystore tools/release.keystore
            echo "Keystore: tetap dari repo (keystore/dtp-fixed.keystore), tanda tangan sama di setiap build"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          [ -z "$KEYSTORE_PASS" ] && unset KEYSTORE_PASS
          [ -z "$KEYSTORE_ALIAS" ] && unset KEYSTORE_ALIAS
          python3 -m pip install --quiet pillow
          python3 build_dtp.py

      - uses: actions/upload-artifact@v4
        with:
          name: KingdomInChaosDTP-v17.14.8-price-barter-crashfix-apk
          path: KingdomInChaosDTP-v17.14.8-price-barter-crashfix.apk
